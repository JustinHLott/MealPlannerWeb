
<div id="editModal" class="modal">
        <div id="modal-content" class="modal-content">
            <div class="step" id="step1">
                <div id="dateInput">
                    <h4 style="margin:0; padding:0;">Edit Date</h4>
                    <input type="date" id="editDate"  style="font-size: 1.3em;font-family: Arial, Helvetica, sans-serif;"></input> 
                </div>
                
                <h4 id="idH4" style="margin:0; padding:0;">Edit Meal Description</h4>
                <textarea id="editTextarea" class="textareaSize" style="width: 100%;height: 100px; font-size: 1.3em;font-family: Arial, Helvetica, sans-serif;"></textarea><br>
                <div id="groceryDiv"></div><br>
                <button id="addGroceryBtn"  style="font-size: 1em;color: green; margin-bottom: 10px;">Add Groceries➕</button> 
                <table id="groceryTable" border="1" cellspacing="0" cellpadding="5" style="margin-bottom:10px; width: 100%;
                        max-width: 350px;
                        table-layout: fixed;
                        border-collapse: collapse;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                        white-space: normal;">
                  <thead>
                    <tr>
                      <th cellpadding="5" width="40px">Qty</th>
                      <th cellpadding="5" >Description</th>
                      <th width="60px">Acts</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody">
                    <!-- JS will insert rows here -->
                  </tbody>
                </table>
                
                <button id="saveEditBtn"  style="font-size: 1em;padding:0;margin:0;">💾Save</button>
                <button id="deleteEditBtn"  style="font-size: 1em;padding:0;margin:0;">🗑️Delete</button>
                <button id="cancelEditBtn"  style="font-size: 1em;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
            <div class="step" id="step2" style="display:none;">
                <h4 style="margin:0; padding:0;">Edit Qty &nbsp;&nbsp;&nbsp;&nbsp;Edit Grocery Item</h4>
                <div style="display: flex; flex-direction: row;">
                  <input type="text" id="editQtyText" style="width: 80px; font-size: 1.3em;"></textarea><br>
                  <input type="text" id="editGroceryText" style="width: 100%; font-size: 1.3em;"></textarea><br>
                </div>
                <button id="saveGroceryBtn"  style="font-size: 1em; margin-top: 10px;">💾Save</button>
                <button id="cancelGroceryBtn"  style="font-size: 1em; margin-top: 10px;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
            <div class="step" id="step3" style="display:none;">
                <h4 style="margin:0; padding:0;">Add Qty &nbsp;&nbsp;&nbsp;&nbsp;Add Grocery Item</h4>
                <div style="display: flex; flex-direction: row;">
                  <input type="text" id="addQtyText" style="width: 80px; font-size: 1.3em;"></input><br>
                  <input type="text" id="addGroceryText" style="width: 100%; font-size: 1.3em;"></input><br>
                </div>
                <button id="saveNewGroceryBtn"  style="font-size: 1em; margin-top: 10px;">💾Save</button>
                <button id="cancelNewGroceryBtn"  style="font-size: 1em; margin-top: 10px;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
        </div>
    </div>
