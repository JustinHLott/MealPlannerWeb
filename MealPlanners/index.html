<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/allMeals.css?v=1.00">
  <link rel="stylesheet" href="css/confirm.css?v=1.00">
  <title>Meal Planners: Week</title>
</head>
<body>
  
    <header>
    <div>
        <h2 class="theHeader whiteText">Meals By Week</h2><br>
        <nav>
            <div id="navDiv1">
              <a href="addMeal.html" id="addMealNav">
                <div class="navButtonDiv">
                  <div>➕</div>
                  <div class="navSmallFont">Add Meal</div>
                </div>
              </a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <a href="addGroceryItem.html" id="addGroceriesNav">
                <div class="navButtonDiv">
                  <div>➕</div>
                  <div class="navSmallFont">Add Grocery</div>
                </div>
              </a>&nbsp;&nbsp;&nbsp;&nbsp;
              <button id="past" style="margin-right: 10px">
                <div class="navButtonDiv allUnsetCursorPointer">
                  <div class="navAarow">⇐</div>
                </div>
              </button>&nbsp;&nbsp;
              <button id="currentWeekBtn"class="whiteSpace">
                <div class="navButtonDiv allUnsetCursorPointer">
                  <div class="navMediumFont">Current</div>
                  <div class="navMediumFont">Week</div>
                </div>
              </button>&nbsp;&nbsp;
              <button id="future">
                <div class="navButtonDiv allUnsetCursorPointer">
                  <div class="navAarow">⇒</div>
                </div>
              </button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>
        </nav>
    </div>
    
  </header>

  <main style="font-size: 1.3em;">
    <div id="theMeals" style="margin:0; padding:0;" class="whiteText"></div><br>
    <div id="edit--modal"></div>
    <p style="margin-top: 200px;"></p>
  </main>
  <div id="custom-confirm"></div>
  <div id="footerComponent"></div>

  <script>
    // Bind to button in JS
    if(document.querySelector(".custom-button")){
        document.querySelector(".custom-button").addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                e.target.click(); // trigger the click handler
            }
        });
    }
    
  </script>
  <script type="module" src="js/grocery.js"></script>
  <script type="module" src="js/thisWeek.js"></script>
  
</body>
</html>
