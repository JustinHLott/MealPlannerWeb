<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/allMeals.css?v=1.00">
  <link rel="stylesheet" href="css/confirm.css?v=1.00">
  <title>Meal Planners: All Meals</title>

</head>
<body>

  <header>
    <div>
        <h2 class="theHeader whiteText">Groceries</h2><br>
        <div id="headerComponent"></div>
    </div>
    
  </header>

  <main style="font-size: 1.3em;">
    <div id="theGroceries" style="margin:0; padding:0;" class="whiteText"></div><br>
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="step" id="step1">
              <label id = "dateLabel"></label><!--Here I need to add the meal description and meal date-->
              <label id = "descLabel"></label>
              <h4 style="margin:0; padding:0;">Edit Qty &nbsp;&nbsp;&nbsp;Edit Grocery Desc</h4>
              <div style="display: flex; flex-direction: row; margin-bottom: 10px;">
                <input type="text" id="editQty"  style="width: 80px; font-size: 1.3em;font-family: Arial, Helvetica, sans-serif;"></input>
                <input type="text" id="editText" class="textareaSize" style="width: 100%; height: auto; font-size: 1.3em;font-family: Arial, Helvetica, sans-serif;"></input><br>
              </div>  
                

                <button id="saveEditBtn"  style="font-size: 1em;padding:0;margin:0;">💾Save</button>
                <button id="deleteEditBtn"  style="font-size: 1em;padding:0;margin:0;">🗑️Delete</button>
                <button id="cancelEditBtn"  style="font-size: 1em;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
            <div class="step" id="step2" style="display:none;">
                <h4 style="margin:0; padding:0;">Edit Qty &nbsp;&nbsp;&nbsp;&nbsp;Edit Grocery Item</h4>
                <div style="display: flex; flex-direction: row;">
                  <input type="text" id="editQtyText" style="width: 80px; font-size: 1.3em;"></textarea><br>
                  <input type="text" id="editGroceryText" style="width: 100%; font-size: 1.3em;"></textarea><br>
                </div>
                <button id="saveGroceryBtn"  style="font-size: 1em; margin-top: 10px;">💾Save</button>
                <button id="cancelGroceryBtn"  style="font-size: 1em; margin-top: 10px;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
            <div class="step" id="step3" style="display:none;">
                <h4 style="margin:0; padding:0;">Add Qty &nbsp;&nbsp;&nbsp;&nbsp;Add Grocery Item</h4>
                <div style="display: flex; flex-direction: row;">
                  <input type="text" id="addQtyText" style="width: 80px; font-size: 1.3em;"></input><br>
                  <input type="text" id="addGroceryText" style="width: 100%; font-size: 1.3em;"></input><br>
                </div>
                <button id="saveNewGroceryBtn"  style="font-size: 1em; margin-top: 10px;">💾Save</button>
                <button id="cancelNewGroceryBtn"  style="font-size: 1em; margin-top: 10px;">❌Cancel</button>
                <p style="margin-top: 200px;"></p>
            </div>
        </div>
    </div>
    <p style="margin-top: 200px;"></p>
  </main>

  <div id="footerComponent"></div>
  <div id="custom-confirm"></div>
  <script>
    // Bind to button in JS
    //document.getElementById("addCommentBtn").addEventListener("click", () => { addComment1(); });
    if(document.querySelector(".custom-button")){
        document.querySelector(".custom-button").addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                e.target.click(); // trigger the click handler
            }
        });
    }
    
  </script>

  <script type="module" src="js/groceries.js"></script>
  <script type="module" src="js/allGroceries.js"></script>
</body>
</html>
